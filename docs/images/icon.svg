<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Meso Mode icon: a Mesoamerican stepped pyramid (tiers, a central stairway, a temple with a roof
       comb) in white outline on black. Original artwork, GPL-3.0-or-later like the project. -->
  <rect width="256" height="256" fill="#000"/>
  <g fill="#000" stroke="#fff" stroke-width="7" stroke-linejoin="miter">
    <!-- five tiers, each narrower and set back, the last one under the temple -->
    <rect x="26" y="190" width="204" height="30"/>
    <rect x="44" y="162" width="168" height="28"/>
    <rect x="62" y="136" width="132" height="26"/>
    <rect x="80" y="112" width="96" height="24"/>
    <rect x="96" y="90" width="64" height="22"/>
    <!-- the stairway up the front, over the tiers -->
    <path d="M116 90 H140 L150 220 H106 Z"/>
    <!-- the temple and its roof comb -->
    <rect x="102" y="58" width="52" height="32"/>
    <rect x="112" y="30" width="32" height="28"/>
  </g>
  <g stroke="#fff" stroke-width="5">
    <!-- steps of the stairway -->
    <line x1="113" y1="124" x2="143" y2="124"/>
    <line x1="111" y1="150" x2="145" y2="150"/>
    <line x1="109" y1="176" x2="147" y2="176"/>
    <line x1="108" y1="200" x2="148" y2="200"/>
  </g>
  <!-- the temple door and the roof comb's openings -->
  <path d="M120 90 V76 Q128 68 136 76 V90" fill="#fff"/>
  <rect x="119" y="38" width="6" height="12" fill="#fff"/>
  <rect x="131" y="38" width="6" height="12" fill="#fff"/>
</svg>
