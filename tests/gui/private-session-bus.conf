<!-- The nested GUI sessions' private D-Bus (the config file of dbus-run-session): the stock session
     config minus every service directory, so nothing is ever activated on it. With the stock
     config a nested session started the desktop's portal (xdg-desktop-portal-kde) and ksecretd,
     which crashed without a display, were restarted in a loop and flooded the desktop's crash
     handler (thousands of reports; the desktop compositor stalled). The socket lives in the
     session's private XDG_RUNTIME_DIR. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:runtime=yes</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
